# Shared by every included build. Each build imports it explicitly from its own settings file.
[versions]
spring-boot = "4.1.1"
# AGP 9.4 requires Gradle 9.6.0+ and JDK 17+, and bundles Kotlin Gradle plugin 2.2.10
# (min and default), so `org.jetbrains.kotlin.android` is no longer applied.
android-gradle-plugin = "9.4.1"
# Kept on the 2.2 line so that the classes produced by the standalone bridge-core build
# stay readable by the Kotlin compiler that AGP 9.4 bundles.
kotlin = "2.2.10"
junit = "6.1.3"
auth0-android = "4.1.0"
androidx-webkit = "1.17.0"
androidx-appcompat = "1.8.0"
androidx-biometric = "1.1.0"
# Gradle plugin (and matching flyway-core/flyway-database-postgresql) for running Flyway
# migrations against the customer ledger database; see backend/build.gradle.kts.
flyway = "13.7.0"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

[libraries]
auth0-android = { module = "com.auth0.android:auth0", version.ref = "auth0-android" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
