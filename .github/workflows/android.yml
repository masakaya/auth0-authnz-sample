name: Android

# The development machine has no Android SDK, so the debug APK is built here and downloaded from
# the run. -PrequireAndroid makes the root build fail rather than quietly skip the Android build.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The runner image ships the SDK and sets ANDROID_HOME; this only makes sure the platform and
      # build tools the build compiles against are among the installed packages.
      - name: Install the compile SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          sdkmanager="$(ls "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "${sdkmanager}" --licenses > /dev/null || true
          "${sdkmanager}" 'platforms;android-36' 'build-tools;36.0.0'

      # A build of its own, so that these run without an Android SDK as well.
      - name: Bridge unit tests
        run: ./gradlew -p android/bridge-core test

      - name: App unit tests and debug APK
        run: ./gradlew -PrequireAndroid :android:app:testDebugUnitTest :android:app:assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            android/bridge-core/build/reports/tests/
            android/app/build/reports/tests/
          if-no-files-found: ignore
